name: Generate GitHub Stats Images

on:
  schedule:
    - cron: "5 0 * * *"  # daily
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate-stats-images.yml"

permissions:
  contents: write

env:
  # Pinned to a specific jstrieb/github-stats release so the binary can't
  # silently change; bump deliberately when upgrading.
  GITHUB_STATS_VERSION: "2.0.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download github-stats binary
        run: |
          curl -fsSL \
            -o github-stats \
            "https://github.com/jstrieb/github-stats/releases/download/${GITHUB_STATS_VERSION}/github-stats_x86_64-linux"
          chmod +x github-stats

      - name: Switch to generated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin generated 2>/dev/null || true
          git checkout generated || git checkout -b generated

      - name: Generate images
        run: ./github-stats
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          EXCLUDE_REPOS: ${{ secrets.EXCLUDE_REPOS }}
          EXCLUDE_LANGS: ${{ secrets.EXCLUDE_LANGS }}
          SILENT: "true"

